workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "IQEA_Deploy_Brnach"'
    - when: never

stages:
  - deploy

variables:
  AZURE_RESOURCE_GROUP: "Quality-Engineering-CoE"
  AZURE_WEBAPP_NAME: "iqea-poc"
  AZURE_SUBSCRIPTION_NAME: "client-demo"

  ACR_NAME: "daqeregistry"
  ACR_LOGIN_SERVER: "daqeregistry-ebcdc2ere2cdcnb4.azurecr.io"

  IMAGE_NAME: "iqea"
  DOCKER_PLATFORM: "linux/amd64"

  ACR_MANAGED_IDENTITY_CLIENT_ID: "a5095c1e-a49f-4047-90e6-7f3474149aac"

  SELENIUM_IMAGE: "selenium/hub:4.27.0"
  CHROME_IMAGE: "selenium/node-chrome:4.27.0"

deploy_iqea:
  stage: deploy

  image:
    name: mcr.microsoft.com/azure-cli:latest
    entrypoint: [""]

  script:

    - az login --use-device-code

    - |
      SUBSCRIPTION_ID=$(az account list \
        --query "[?name=='$AZURE_SUBSCRIPTION_NAME'].id | [0]" \
        -o tsv)

      az account set --subscription "$SUBSCRIPTION_ID"

    - |
      IMAGE_TAG="$CI_COMMIT_SHA"
      IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      az acr build \
        --registry "$ACR_NAME" \
        --platform "$DOCKER_PLATFORM" \
        --file deploy/Dockerfile \
        --image "$IMAGE_NAME:$IMAGE_TAG" \
        --image "$IMAGE_NAME:latest" \
        .

    - |
      az acr repository show \
        --name "$ACR_NAME" \
        --image "$IMAGE_NAME:$IMAGE_TAG"

    - |
      MODE=$(az webapp show \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "$AZURE_WEBAPP_NAME" \
        --query "siteConfig.linuxFxVersion" -o tsv)

      if [ "$MODE" != "SITECONTAINERS" ]; then
        az webapp sitecontainers convert \
          -g "$AZURE_RESOURCE_GROUP" \
          -n "$AZURE_WEBAPP_NAME" \
          --mode sitecontainers \
          --yes
      fi

    - |
      az webapp config set \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "$AZURE_WEBAPP_NAME" \
        --generic-configurations \
        "{\"acrUseManagedIdentityCreds\":true,\"acrUserManagedIdentityID\":\"$ACR_MANAGED_IDENTITY_CLIENT_ID\"}"

    - |
      az webapp config appsettings set \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "$AZURE_WEBAPP_NAME" \
        --settings \
          IQEA_EXECUTION_TYPE=azure \
          SELENIUM_REMOTE_URL=http://127.0.0.1:4444/wd/hub \
          GRID_UPSTREAM=127.0.0.1:4444 \
          IQEA_NOVNC_PATH=/vnc/ \
          PYTHONPATH=/app \
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python \
          TESSERACT_CMD=/usr/bin/tesseract \
          SE_BIND_HOST=0.0.0.0 \
          SE_EVENT_BUS_HOST=127.0.0.1 \
          SE_EVENT_BUS_PUBLISH_PORT=4442 \
          SE_EVENT_BUS_SUBSCRIBE_PORT=4443 \
          SE_NODE_MAX_SESSIONS=1 \
          SE_NODE_OVERRIDE_MAX_SESSIONS=true \
          SE_NODE_PORT=5555 \
          SE_VNC_PORT=5900 \
          SE_NO_VNC_PORT=7900

    - |
      if az webapp sitecontainers show \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "$AZURE_WEBAPP_NAME" \
        --container-name main >/dev/null 2>&1
      then
        az webapp sitecontainers update \
          -g "$AZURE_RESOURCE_GROUP" \
          -n "$AZURE_WEBAPP_NAME" \
          --container-name main \
          --image "$IMAGE" \
          --target-port 8000 \
          --ui "$ACR_MANAGED_IDENTITY_CLIENT_ID"
      else
        az webapp sitecontainers create \
          -g "$AZURE_RESOURCE_GROUP" \
          -n "$AZURE_WEBAPP_NAME" \
          --container-name main \
          --image "$IMAGE" \
          --target-port 8000 \
          --is-main true \
          --ui "$ACR_MANAGED_IDENTITY_CLIENT_ID"
      fi

    - |
      if az webapp sitecontainers show \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "$AZURE_WEBAPP_NAME" \
        --container-name selenium-hub >/dev/null 2>&1
      then
        az webapp sitecontainers update \
          -g "$AZURE_RESOURCE_GROUP" \
          -n "$AZURE_WEBAPP_NAME" \
          --container-name selenium-hub \
          --image "$SELENIUM_IMAGE" \
          --target-port 4444
      else
        az webapp sitecontainers create \
          -g "$AZURE_RESOURCE_GROUP" \
          -n "$AZURE_WEBAPP_NAME" \
          --container-name selenium-hub \
          --image "$SELENIUM_IMAGE" \
          --target-port 4444 \
          --is-main false
      fi

    - |
      if az webapp sitecontainers show \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "$AZURE_WEBAPP_NAME" \
        --container-name chrome-node-1 >/dev/null 2>&1
      then
        az webapp sitecontainers update \
          -g "$AZURE_RESOURCE_GROUP" \
          -n "$AZURE_WEBAPP_NAME" \
          --container-name chrome-node-1 \
          --image "$CHROME_IMAGE" \
          --target-port 5900
      else
        az webapp sitecontainers create \
          -g "$AZURE_RESOURCE_GROUP" \
          -n "$AZURE_WEBAPP_NAME" \
          --container-name chrome-node-1 \
          --image "$CHROME_IMAGE" \
          --target-port 5900 \
          --is-main false
      fi

    - |
      az webapp restart \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "$AZURE_WEBAPP_NAME"

    - |
      echo "Final Site Containers"
      az webapp sitecontainers list \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "$AZURE_WEBAPP_NAME" \
        -o table

    - |
      echo "ACR Managed Identity"
      az webapp config show \
        -g "$AZURE_RESOURCE_GROUP" \
        -n "$AZURE_WEBAPP_NAME" \
        --query "{AcrUseManagedIdentityCreds:acrUseManagedIdentityCreds,AcrUserManagedIdentityID:acrUserManagedIdentityID}" \
        -o table