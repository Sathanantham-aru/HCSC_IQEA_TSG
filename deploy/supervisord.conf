# nginx and Streamlit run side by side in the main container.
# Logs go to stdout/stderr so Azure Log Stream picks them up.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:streamlit]
command=streamlit run /app/IQEA.py
    --server.port=8501
    --server.address=127.0.0.1
    --server.headless=true
    --server.enableCORS=false
    --server.enableXsrfProtection=false
    --browser.gatherUsageStats=false
directory=/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; CORS/XSRF are disabled because Streamlit sits behind the nginx reverse proxy
; on a different internal origin; leaving them on breaks the WebSocket handshake.

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
; Start after Streamlit so the first proxied request has a backend to reach.
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
