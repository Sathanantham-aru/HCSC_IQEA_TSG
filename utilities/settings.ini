[GENERAL]
source=database
model=azureopenai

[EXECUTION]
# local -> runs on a workstation: Chrome opens on this machine, .env is loaded,
#          desktop (WinAppDriver) recording available. Behaves exactly as before.
# azure -> runs in a Linux container: Chrome lives in a separate container and is
#          driven over WebDriver + viewed through noVNC, environment comes from
#          Azure App Service settings (no .env), desktop recording disabled.
# DO NOT commit this as 'azure'. This file is shared through git, so flipping it
# breaks every developer's local run. To run in azure mode, set the env var
# IQEA_EXECUTION_TYPE=azure instead — it overrides this line without touching it
# (in Azure, set it as an App Service application setting).
execution_type=local

[BROWSER]
# Only used when execution_type=azure. Ignored for local runs.
# WebDriver endpoint of the Chrome container (selenium/standalone-chrome).
# App Service sidecars share a network namespace, so the Hub is on localhost.
# Compose/K8s override this with a service name via SELENIUM_REMOTE_URL.
selenium_remote_url=http://127.0.0.1:4444/wd/hub
# VNC password for the live browser view. The selenium images default to
# "secret" unless the sidecar sets SE_VNC_NO_PASSWORD=true. Setting it here lets
# the app pass it to the noVNC client so the user is never prompted.
# Override with env var IQEA_NOVNC_PASSWORD. Leave blank if the sidecar runs
# with SE_VNC_NO_PASSWORD=true.
novnc_password=secret
# Path where nginx reverse-proxies the container's noVNC (port 7900) so the
# recorder UI can embed it. App Service exposes only one public port.
novnc_path=/vnc/
# Chrome window size. Needed because a container has no window manager to
# maximise against on first paint.
window_size=1920,1080
# How many Chrome containers are available to lease, one per recording session.
# Each container has its own X display, so this is also the maximum number of
# people who can record at the same time without seeing each other's browser.
browser_pool_size=5
# Idle lease is reclaimed after this many minutes so an abandoned tab does not
# hold a browser forever.
session_timeout_mins=30
# Seconds between recorder monitor-thread polls. Each user's recording runs 4
# threads, and every poll is several WebDriver round-trips. Locally that is
# free; against a shared Grid with many users it is real load, so azure uses a
# longer interval. Blank = 2s local / 5s azure.
recorder_poll_secs=
# Per-poll debug printing from the recorder threads (last_focused/current_url
# etc). Very noisy: one block per thread per poll, per user. Blank = on locally,
# off in azure, where it would dominate the log bill.
debug_logs=

[OCR]
# Absolute path to the tesseract binary. Blank = resolve from PATH (local
# default). In the container this is /usr/bin/tesseract.
tesseract_cmd=
# Prefer the vision-LLM OCR path over the tesseract binary.
prefer_vision_ocr=false

# ── Application database (MySQL) ─────────────────────────────────────────────
# The section used is chosen by EXECUTION/execution_type above:
#   execution_type=local -> [DATABASE_local]
#   execution_type=azure -> [DATABASE_azure]
# Nothing else switches; there is no separate azure code path to keep in sync.
#
# Every option here can be overridden by an environment variable, which is how
# the Azure deployment should supply its credentials: set IQEA_DB_HOST,
# IQEA_DB_USER, IQEA_DB_PASSWORD and IQEA_DB_NAME as App Service application
# settings. This file is shared through git, so a password committed here is a
# password in everyone's clone and in the repo history.
#
# Passwords are written plainly — do NOT percent-encode them. The connection
# string escapes them, unlike the old PostgreSQL entry which stored
# "Automation%40123" pre-escaped by hand.

[DATABASE_local]
DB_HOST=127.0.0.1
DB_PORT=3306
DB_USER=root
DB_PASSWORD=Root@123
DB_NAME=iqea
DB_SSL_DISABLED=True
DB_UPDATE_USER=sahil.gupta

[DATABASE_azure]
DB_HOST=vsmqedb.mysql.database.azure.com
DB_PORT=3306
DB_USER=qevsmuser
DB_PASSWORD=Vsmuser_321
DB_NAME=iqea_azure
DB_SSL_DISABLED=True
DB_UPDATE_USER=sahil.gupta

# Read only by utilities/db_utils/migrate_pg_to_mysql.py, to copy the existing
# data across once. Nothing in the running app touches PostgreSQL any more; this
# section can be deleted after the migration has been verified.
[DATABASE_postgres_legacy]
DB_HOST=localhost
DB_PORT=5432
DB_USER=postgres
DB_PASSWORD=Automation@123
DB_NAME=ai_assistant

[API]
